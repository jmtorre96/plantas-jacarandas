<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F4A38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuemanco">
<title>Cuemanco · Plantas Casa Jacarandas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9ECE1; --card:#FBFBF5; --ink:#1E2A22; --sub:#5F6E62; --faint:#8C9887;
    --line:#D6DACB; --forest:#2F4A38; --forestSoft:#E3EBE1; --ochre:#A9741E; --ochreSoft:#F1E7D1; --danger:#9B3B2E;
    --serif:'Fraunces', ui-serif, Georgia, 'Times New Roman', serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
       padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:480px;margin:0 auto}
  #app{display:block;padding-bottom:96px}
  .serif{font-family:var(--serif)}
  input,textarea,button{font-family:inherit}
  input:focus,textarea:focus{outline:2px solid var(--forest);outline-offset:1px}
  ::placeholder{color:var(--faint)}
  button{cursor:pointer;border:none;background:none;color:inherit}
  .pad{padding:0 20px}
  h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin:4px 0 0}
  .eyebrow{display:flex;align-items:center;gap:8px;color:var(--forest);font-size:12px}
  .eyebrow span{color:var(--sub);letter-spacing:.02em}
  .head{padding:28px 20px 16px}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .stat{border-radius:16px;padding:16px}
  .stat.dark{background:var(--forest);color:#fff}
  .stat.light{background:var(--card);border:1px solid var(--line)}
  .stat .k{font-size:12px}
  .stat.dark .k{opacity:.8}
  .stat.light .k{color:var(--sub)}
  .stat .v{font-family:var(--serif);font-weight:600;font-size:24px;margin-top:2px}
  .stat .s{font-size:12px;margin-top:4px}
  .stat.dark .s{opacity:.8}
  .stat.light .s{color:var(--faint)}

  .toolrow{display:flex;gap:14px;margin-top:12px}
  .tool{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--forest)}
  .searchbox{margin-top:16px;display:flex;align-items:center;gap:8px;border-radius:12px;padding:9px 12px;background:var(--card);border:1px solid var(--line)}
  .searchbox input{border:none;background:transparent;width:100%;font-size:14px;color:var(--ink)}
  .tabs{margin-top:12px;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .pill{white-space:nowrap;border-radius:999px;padding:6px 14px;font-size:14px;background:var(--card);color:var(--sub);border:1px solid var(--line)}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-top:14px}
  .seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:9px;font-size:14px;color:var(--sub);font-weight:500}
  .seg button.on{background:var(--forest);color:#fff}

  .list{padding:0 20px;display:flex;flex-direction:column;gap:12px}
  .pcard{display:flex;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
  .pcard .cover{width:96px;flex:0 0 96px;background:var(--forestSoft);min-height:108px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pcard .cover img{width:100%;height:100%;object-fit:cover}
  .pcard .body{flex:1;padding:14px;min-width:0}
  .pcard .zone{font-size:12px;color:var(--forest);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .name{font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .sci{font-size:12px;font-style:italic;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .meta{margin-top:8px;font-size:12px;color:var(--sub);display:flex;gap:12px}
  .pcard .price{margin-top:6px;font-size:14px}
  .badge{border-radius:999px;padding:2px 8px;font-size:12px;flex:0 0 auto}
  .rowtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}

  .fab{position:fixed;right:20px;bottom:20px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.18);
       display:flex;align-items:center;gap:8px;padding:14px 20px;color:#fff;background:var(--forest);font-weight:500;font-size:15px;z-index:20}
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20}
  .tabbar .inner{max-width:480px;margin:0 auto;display:flex}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;color:var(--faint);font-size:12px}
  .tabbar button.on{color:var(--forest)}
  .tabbar button.on span{font-weight:600}

  /* route */
  .prog{margin-top:16px;border-radius:16px;padding:16px;background:var(--card);border:1px solid var(--line)}
  .prog .top{display:flex;justify-content:space-between;align-items:flex-end}
  .prog .top .n{font-family:var(--serif);font-weight:600;font-size:24px;color:var(--forest)}
  .bar{margin-top:8px;height:8px;border-radius:999px;background:var(--forestSoft);overflow:hidden}
  .bar>div{height:100%;border-radius:999px;background:var(--forest)}
  .rgroup{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
  .rgroup .gh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
  .rgroup .gh .zn{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
  .rgroup .gh .cnt{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--forestSoft);color:var(--forest)}
  .rrow{display:flex;align-items:center;gap:8px;padding:0 16px}
  .rrow+.rrow{border-top:1px solid var(--line)}
  .rrow .chk{flex:0 0 auto;padding:6px}
  .rrow .txt{flex:1;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 0;min-width:0;text-align:left}
  .rrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .qt{font-size:12px;color:var(--faint)}

  /* detail */
  .dhead{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:8px;padding:12px 12px}
  .dhead .t{flex:1;min-width:0;font-family:var(--serif);font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .section{margin-top:20px}
  .sectitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .sectitle .l{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .box{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:14px}
  .specrow{display:flex;gap:8px;font-size:14px;margin-bottom:6px}
  .specrow b{flex:0 0 112px;color:var(--faint);font-weight:400}
  .photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .ph{position:relative;border-radius:12px;overflow:hidden;background:var(--forestSoft);aspect-ratio:1}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph .del{position:absolute;top:4px;right:4px;border-radius:999px;padding:4px;background:rgba(0,0,0,.55);line-height:0}
  .addph{border-radius:12px;border:1.5px dashed var(--line);color:var(--forest);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border-radius:999px;padding:6px 12px;font-size:14px;background:var(--card);color:var(--sub);border:1px solid var(--line)}
  .chip.on{background:var(--forest);color:#fff;border-color:var(--forest)}
  label.f{display:block}
  label.f>span{font-size:12px;color:var(--sub)}
  .inp{margin-top:4px;width:100%;border-radius:8px;padding:8px 12px;font-size:14px;background:#fff;border:1px solid var(--line);color:var(--ink)}
  textarea.inp{resize:none}
  .btn{border-radius:12px;padding:9px 14px;font-size:14px;text-align:center}
  .btn.primary{background:var(--forest);color:#fff}
  .btn.primary[disabled]{background:var(--faint)}
  .btn.ghost{border:1px solid var(--line);color:var(--sub)}
  .btn.line{border:1.5px dashed var(--line);color:var(--forest);width:100%;display:flex;align-items:center;justify-content:center;gap:6px}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fff}
  .stepper button{padding:4px 12px;font-size:18px;color:var(--forest)}
  .stepper .val{width:32px;text-align:center;font-size:14px;font-weight:500}
  .moneyin{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 10px}
  .moneyin span{color:var(--faint)}
  .moneyin input{border:none;background:transparent;width:96px;margin-left:4px;font-size:14px;color:var(--ink)}
  .prop{border-radius:12px;background:var(--card);border:1px solid var(--line);padding:12px}
  .prop.final{border-color:var(--forest)}
  .prop .pr{font-family:var(--serif);font-weight:600;font-size:18px}
  .tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;border-radius:999px;padding:2px 6px;background:var(--ochreSoft);color:var(--ochre)}
  .rowbtns{margin-top:8px;display:flex;gap:8px}

  .overlay{position:fixed;inset:0;background:rgba(20,28,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:480px;background:var(--paper);border-radius:24px 24px 0 0;padding:20px;max-height:92vh;overflow-y:auto}
  .sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .muted{color:var(--sub);font-size:14px}
  .center{text-align:center}
  .space{height:12px}
  svg.i{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
  svg.s{width:16px;height:16px}
  svg.xs{width:13px;height:13px}

  /* supplier quote sheet (print → save as PDF) */
  #printsheet{display:none}
  @media print{
    body{background:#fff;color:#000;padding:0}
    .wrap,.fab,.tabbar,.overlay{display:none !important}
    #printsheet{display:block !important}
    .psheet{font-family:Georgia,'Times New Roman',serif;color:#111;padding:6px 4px}
    .psheet h1{font-size:20px;margin:0 0 2px}
    .pmeta{color:#555;font-size:12px;margin-bottom:12px}
    .pline{width:100%;font-size:12px;border-collapse:collapse;margin-bottom:6px}
    .pline td{padding:3px 0}
    .pnote{font-size:12px;margin:10px 0;line-height:1.5}
    table.ptable{width:100%;border-collapse:collapse;font-size:12px}
    table.ptable th,table.ptable td{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:top}
    table.ptable th{background:#eee}
    table.ptable td.fill{min-width:64px}
    table.ptable tr{page-break-inside:avoid}
    thead{display:table-header-group}
  }
</style>
</head>
<body>

<div id="printsheet"></div>
<script>
/* ---------------- icons ---------------- */
const P = {

  search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4-4', pencil:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',

function ic(name, cls){ const p=P[name]; return `<svg class="i ${cls||''}" viewBox="0 0 24 24">${p.split('M').filter(Boolean).map(d=>`<path d="M${d}"/>`).join('')}</svg>`; }
function icCheckCircle(cls){ return `<svg class="i ${cls||''}" viewBox="0 0 24 24"><path d="${P.ccirc1}"/><path d="${P.ccirc2}"/></svg>`; }

/* ---------------- data ---------------- */
const ZONES = ["Jardinera baño","Jardinera terraza","Jardinera bar","Jardinera fachada calle","Jardinera puerta calle"];
const CATS = ["Plantas","Tierra","Macetas"];
const STATUS = { pending:{label:"Por comprar",color:"var(--faint)",soft:"#E7E9DE"},
  comparing:{label:"Comparando",color:"var(--ochre)",soft:"var(--ochreSoft)"},
  bought:{label:"Comprado",color:"var(--forest)",soft:"var(--forestSoft)"} };

const money = n => "$"+(Number(n)||0).toLocaleString("es-MX",{maximumFractionDigits:2});
function uom(q,u){const s=(u||"").trim().toLowerCase();return ["pieza","piezas","lote","lotes","ejemplar","ejemplares"].includes(s)?(Number(q)===1?"pieza":"piezas"):u;}
function qtyfmt(n){ n=Number(n)||0; return Number.isInteger(n)?String(n):String(parseFloat(n.toFixed(3))); }
function tgtDelta(price,target){ const t=Number(target),pr=Number(price); if(!t||!pr) return ""; const d=Math.round((pr-t)/t*100); const under=d<=0; return ` <span style="font-size:11px;color:${under?"var(--forest)":"var(--danger)"}">${d>0?"+":""}${d}% vs objetivo</span>`; }
const uid = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const bestPrice = p => p.proposals.length ? Math.min(...p.proposals.map(x=>Number(x.price)||Infinity)) : null;
const bestProp  = p => p.proposals.reduce((b,pr)=> b===null||(Number(pr.price)||Infinity)<(Number(b.price)||Infinity)?pr:b, null);

const mk = o => { const m = Object.assign({ scientific:"", qtyNeeded:1, unit:"pieza", zone:"", category:"Plantas", target:"",
  specs:{size:"",container:"",notes:""}, proposals:[], photos:[], status:"pending",
  finalProposalId:null, finalSupplier:"", finalPrice:"", finalQty:"", createdAt:Date.now() }, o);
  if(!o.category) m.category = ["L","m²"].includes(m.unit) ? "Tierra" : "Plantas";
  return m; };

const SEED = [
  mk({id:"encino-rojo",name:"Encino rojo",scientific:"Quercus sp.",qtyNeeded:2,unit:"pieza",zone:"Lindero norte",

  mk({id:"dieffenbachia",name:"Dieffenbachia",scientific:"Dieffenbachia seguine",qtyNeeded:1,unit:"pieza",zone:"Jardinera baño",

  mk({id:"cola-de-zorro",name:"Cola de zorro",scientific:"Asparagus densiflorus",qtyNeeded:1,unit:"pieza",zone:"Jardinera baño",

  mk({id:"pothos",name:"Pothos",scientific:"Epipremnum aureum",qtyNeeded:1,unit:"pieza",zone:"Jardinera baño",
    specs:{size:"",container:"",notes:"Jardinera interior del baño."}}),
  mk({id:"xanadu-terraza",name:"Xanadú",scientific:"Philodendron xanadu",qtyNeeded:12,unit:"pieza",zone:"Jardinera terraza",

  mk({id:"helecho-terraza",name:"Helecho chivo — terraza",scientific:"Nephrolepis sp.",qtyNeeded:8,unit:"pieza",zone:"Jardinera terraza",

  mk({id:"pothos-bano-colg",name:"Pothos colgante",scientific:"Epipremnum aureum",qtyNeeded:2,unit:"pieza",zone:"Jardinera baño",

  mk({id:"pothos-terraza",name:"Pothos",scientific:"Epipremnum aureum",qtyNeeded:6,unit:"pieza",zone:"Jardinera terraza",

  mk({id:"pothos-bar",name:"Pothos",scientific:"Epipremnum aureum",qtyNeeded:2,unit:"pieza",zone:"Jardinera bar",
    specs:{size:"",container:"",notes:""}}),
  mk({id:"monstera-trepadora",name:"Monstera adansonii (trepadora)",scientific:"Monstera adansonii",qtyNeeded:2,unit:"pieza",zone:"",status:"comparing",
    specs:{size:"",container:"Con palo de madera (~metros de alto) para trepar",notes:""},
    proposals:[{id:"tal-monstera",supplier:"Talibán",location:"",price:"2800",qtyAvailable:"",notes:"Confirmar si el precio es por pieza o por las 2."}]}),
  mk({id:"filodendro-plowmanii",name:"Filodendro plowmanii",scientific:"Philodendron plowmanii",qtyNeeded:2,unit:"pieza",zone:"Jardinera baño",

  mk({id:"dieffenbachia-mediana",name:"Dieffenbachia mediana",scientific:"Dieffenbachia seguine",qtyNeeded:2,unit:"pieza",zone:"",

  mk({id:"helecho-nido",name:"Helecho nido de ave",scientific:"Asplenium nidus",qtyNeeded:1,unit:"pieza",zone:"Jardinera baño",status:"comparing",

    proposals:[{id:"tal-nido",supplier:"Talibán",location:"",price:"2400",qtyAvailable:"",notes:""}]}),
  mk({id:"raphidophora",name:"Rhaphidophora tetrasperma",scientific:"Rhaphidophora tetrasperma",qtyNeeded:4,unit:"pieza",zone:"Jardinera baño",

  mk({id:"cortezafina-bano",name:"Corteza de pino fina/media",qtyNeeded:0.3,unit:"m³",zone:"Jardinera baño",

/* ---------------- storage (IndexedDB + localStorage fallback) ---------------- */
const DB = {
  _p:null,
  open(){ if(this._p) return this._p; this._p=new Promise(res=>{ try{
      const r=indexedDB.open("cuemanco",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("kv");
      r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);
    }catch(e){res(null);} }); return this._p; },
  async get(k){ const db=await this.open();
    if(!db){ try{const v=localStorage.getItem("cmk:"+k); return v?JSON.parse(v):null;}catch(e){return null;} }
    return new Promise(res=>{ const q=db.transaction("kv","readonly").objectStore("kv").get(k);
      q.onsuccess=()=>res(q.result??null); q.onerror=()=>res(null); }); },
  async set(k,v){ const db=await this.open();
    if(!db){ try{localStorage.setItem("cmk:"+k, JSON.stringify(v));}catch(e){} return; }
    return new Promise(res=>{ const q=db.transaction("kv","readwrite").objectStore("kv").put(v,k);
      q.onsuccess=()=>res(true); q.onerror=()=>res(false); }); }
};

/* ---------------- state ---------------- */
let S = { plants:[], view:"list", tab:"list", returnTo:"list", activeId:null, groupKey:null,
  filter:"all", query:"", sort:"original", cat:"all", editSpecs:false, specsDraft:null, addProp:false, propDraft:null,
  showAdd:false, addDraft:null, hideGot:false };
const app = document.getElementById("app");
const getP = id => S.plants.find(p=>p.id===id);
async function save(){ await DB.set("plants", S.plants); }
async function persist(){ await save(); render(); }

async function init(){
  let saved = await DB.get("plants");
  if(!saved || !Array.isArray(saved) || !saved.length){ S.plants = SEED.map(p=>JSON.parse(JSON.stringify(p))); await save(); }
  else S.plants = saved;
  // one-time cleanup: plants already bought elsewhere
  const REMOVE = ["maple-entrada","maple-poniente","liquidambar","podocarpus","olivo"];
  if(!(await DB.get("cleanup-v1"))){
    S.plants = S.plants.filter(p=>!REMOVE.includes(p.id));
    await DB.set("cleanup-v1", true);
    await save();
  }
  if(!(await DB.get("units-v1"))){
    S.plants.forEach(p=>{ const s=(p.unit||"").trim().toLowerCase(); if(["lote","lotes","ejemplar","ejemplares","pieza","piezas"].includes(s)) p.unit="pieza"; });
    await DB.set("units-v1", true);
    await save();
  }
  const ADD = ["raphidophora","sustrato-bano","fibracoco-bano","cortezafina-bano","perlita-bano","cortezagruesa-bano","piedravolcanica-bano","tezontle-bano","grava-bano","geotextil-bano","sustrato-terraza","fibracoco-terraza","cortezafina-terraza","perlita-terraza","cortezagruesa-terraza","tezontle-terraza","geotextil-terraza"];
  if(!(await DB.get("materials-v1"))){
    const have=new Set(S.plants.map(p=>p.id));
    for(const id of ADD){ if(!have.has(id)){ const s=SEED.find(x=>x.id===id); if(s) S.plants.push(JSON.parse(JSON.stringify(s))); } }
    await DB.set("materials-v1", true);
    await save();
  }
  if(!(await DB.get("cat-v1"))){
    S.plants.forEach(p=>{ if(!p.category) p.category = ["L","m²"].includes(p.unit) ? "Tierra" : "Plantas"; });
    await DB.set("cat-v1", true);
    await save();
  }
  if(!(await DB.get("m3-v1"))){
    const M3M={"sustrato-bano":0.6,"fibracoco-bano":0.375,"cortezafina-bano":0.3,"perlita-bano":0.225,"cortezagruesa-bano":0.2,"piedravolcanica-bano":0.55,"tezontle-bano":0.365,"grava-bano":0.365,"sustrato-terraza":0.285,"fibracoco-terraza":0.16,"cortezafina-terraza":0.125,"perlita-terraza":0.065,"cortezagruesa-terraza":0.075,"tezontle-terraza":0.125};
    S.plants.forEach(p=>{ if(M3M[p.id]!==undefined){ p.qtyNeeded=M3M[p.id]; p.unit="m³"; } });
    await DB.set("m3-v1", true);
    await save();
  }
  render();
}

/* ---------------- render ---------------- */
function render(){
  const a=document.activeElement, fk=a&&a.dataset?a.dataset.focus:null, ss=a&&a.selectionStart;
  let html="";
  if(S.view==="list") html=viewList();
  else if(S.view==="route") html=viewRoute();
  else if(S.view==="group"){ const m=S.plants.filter(p=>p.name.trim().toLowerCase()===S.groupKey); if(m.length){ html=viewGroup(m); } else { S.view="list"; html=viewList(); } }
  else if(S.view==="detail"){ const p=getP(S.activeId); html = p?viewDetail(p):viewList(); }
  if(S.view!=="detail") html += fab();
  app.innerHTML = html;
  if(S.showAdd) app.insertAdjacentHTML("beforeend", modalAdd());
  if(fk){ const e=app.querySelector('[data-focus="'+fk+'"]'); if(e){ e.focus(); try{e.setSelectionRange(ss,ss);}catch(_){} } }
}

function totals(){
  const spent=S.plants.filter(p=>p.status==="bought").reduce((s,p)=>s+(Number(p.finalPrice)||0)*(Number(p.finalQty||p.qtyNeeded)||0),0);
  const pend=S.plants.filter(p=>p.status!=="bought").reduce((s,p)=>{const b=bestPrice(p);return s+(b?b*(Number(p.qtyNeeded)||0):0);},0);
  const bought=S.plants.filter(p=>p.status==="bought").length;
  const budget=S.plants.filter(p=>p.status!=="bought").reduce((s,p)=>s+(Number(p.target)||0)*(Number(p.qtyNeeded)||0),0);
  return {spent,pend,bought,budget};
}

function listBody(items){
  if(!items.length) return `<div class="center" style="padding:60px 0;color:var(--faint)">${ic("leaf")}<p>Nada aquí todavía.</p></div>`;
  const gmap=new Map();
  for(const p of items){ const k=p.name.trim().toLowerCase(); if(!gmap.has(k)) gmap.set(k,[]); gmap.get(k).push(p); }
  let groups=[...gmap.entries()];
  if(S.sort==="az") groups.sort((a,b)=>a[1][0].name.localeCompare(b[1][0].name,"es",{sensitivity:"base"}));
  return groups.map(([k,ms])=> ms.length===1 ? card(ms[0]) : groupCard(k,ms)).join("");
}

function groupSummary(ms){
  const totalQty=ms.reduce((s,m)=>s+(Number(m.qtyNeeded)||0),0);
  const zones=[...new Set(ms.map(m=>(m.zone||"Sin zona").replace(/^Jardinera /,"")))];
  const boughtN=ms.filter(m=>m.status==="bought").length;
  const prices=ms.map(bestPrice).filter(x=>x!==null);
  const best=prices.length?Math.min(...prices):null;
  const unit=ms[0].unit;
  return {totalQty,zones,boughtN,best,unit};
}

function groupCard(key,ms){
  const p0=ms[0], {totalQty,zones,boughtN,best,unit}=groupSummary(ms);
  const cover=ms.map(m=>m.photos[0]).find(Boolean);
  const allBought=boughtN===ms.length;
  const badgeStyle = allBought?"background:var(--forestSoft);color:var(--forest)":"background:#E7E9DE;color:var(--sub)";
  const price = boughtN>0
    ? `<span style="color:var(--forest)">${boughtN}/${ms.length} zonas compradas</span>`
    : best!==null ? `<span style="color:var(--ochre)">Mejor precio: <b>${money(best)}</b></span>`
    : `<span style="color:var(--faint)">Sin propuestas aún</span>`;
  return `<button class="pcard" data-act="opengroup" data-key="${esc(key)}">
    <div class="cover">${cover?`<img src="${cover}">`:ic("leaf")}</div>
    <div class="body">
      <div class="rowtop"><div style="min-width:0">
        <div class="zone">${esc(zones.join(" · "))}</div>
        <div class="name">${esc(p0.name)}</div>

      </div><span class="badge" style="${badgeStyle}">${ms.length} zonas</span></div>
      <div class="meta"><span>Total: <b style="color:var(--ink)">${qtyfmt(totalQty)}</b> ${esc(uom(totalQty,unit))}</span></div>
      <div class="price">${price}</div>
    </div></button>`;
}

      <div class="photos">
        ${p.photos.map((src,i)=>`<div class="ph"><img src="${src}"><button class="del" data-act="delphoto" data-id="${p.id}" data-i="${i}">${ic("x","xs")}</button></div>`).join("")}
        <button class="addph" data-act="addphoto" data-id="${p.id}">${ic("cam","s")}<span>Tomar</span></button>
      </div></div>

    <div class="section"><div class="sectitle"><div class="l">${ic("clip","s")} Especificaciones</div>
      ${!S.editSpecs?`<button class="tool" data-act="editspecs" data-id="${p.id}">${ic("pencil","xs")} Editar</button>`:""}</div>
      ${S.editSpecs?`<div class="box">
        ${field("Tamaño / altura","spec-size",sd.size,"Ej. 1.5 m, cepellón 40 cm")}
        <div class="space"></div>${field("Contenedor / presentación","spec-container",sd.container,"Maceta, bolsa, cepellón…")}
        <div class="space"></div>${field("Notas / estado","spec-notes",sd.notes,"Salud, follaje, forma…",true)}
        <div class="rowbtns"><button class="btn primary" style="flex:1" data-act="savespecs" data-id="${p.id}">Guardar</button>
          <button class="btn ghost" data-act="canspecs">Cancelar</button></div></div>`
      :`<div class="box">${specRow("Tamaño / altura",p.specs.size)}${specRow("Contenedor",p.specs.container)}${specRow("Notas",p.specs.notes)}</div>`}
    </div>

    <div class="section"><div class="sectitle"><div class="l">${ic("award","s")} Precio objetivo / presupuesto</div></div>
      <div class="box">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="muted">Objetivo por ${esc(uom(1,p.unit))}:</span>${moneyIn("target",p.target||"",p.id)}</div>
        ${Number(p.target)?`<div class="muted" style="margin-top:8px">Presupuesto de la partida: <b style="color:var(--ink)">${money((Number(p.target)||0)*(Number(p.qtyNeeded)||0))}</b> <span style="color:var(--faint)">(${qtyfmt(p.qtyNeeded)} ${esc(uom(p.qtyNeeded,p.unit))})</span></div>`:`<div class="muted" style="margin-top:8px;color:var(--faint)">Pon tu precio objetivo para comparar contra las cotizaciones.</div>`}
        ${(Number(p.target)&&bestPrice(p)!==null)?`<div style="margin-top:6px;font-size:13px">Mejor propuesta: <b>${money(bestPrice(p))}</b>${tgtDelta(bestPrice(p),p.target)}</div>`:""}
      </div></div>

    <div class="section"><div class="sectitle"><div class="l">${ic("store","s")} Propuestas de locales${p.proposals.length?" ("+p.proposals.length+")":""}</div>
      ${bp!==null?`<span style="font-size:14px;color:var(--ochre)">Mejor: <b>${money(bp)}</b></span>`:""}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${p.proposals.map(pr=>propRow(p,pr,bp)).join("")}
        ${S.addProp?propForm(p.id):`<button class="btn line" data-act="addprop" data-id="${p.id}">${ic("plus","s")} Anotar precio de un local</button>`}
      </div></div>

    <div class="section"><div class="sectitle"><div class="l">${ic("bag","s")} Compra final</div></div>
      ${p.status==="bought"?`<div class="box" style="background:var(--forestSoft)">
        <div style="display:flex;align-items:center;gap:6px;color:var(--forest);font-size:14px">${ic("check","s")} Comprada</div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:8px"><span class="muted">Cantidad:</span>${stepper("finalQty",Number(p.finalQty)||p.qtyNeeded,p.id)}</div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:8px"><span class="muted">Precio unitario:</span>${moneyIn("finalPrice",p.finalPrice,p.id)}</div>
        <div class="space"></div>${field("Proveedor","finalSupplier",p.finalSupplier,"Nombre del local",false,p.id)}
        <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
          <span class="serif" style="font-size:18px;font-weight:600;color:var(--forest)">Total: ${money((Number(p.finalPrice)||0)*(Number(p.finalQty||p.qtyNeeded)||0))}</span>
          <button class="tool" style="color:var(--sub)" data-act="clearfinal" data-id="${p.id}">Deshacer</button></div></div>`
      :`<div class="box"><p class="muted">Cuando cierres el trato, toca <b style="color:var(--forest)">Elegir</b> en la propuesta ganadora — o registra la compra a mano.</p>
        <button class="btn primary" style="width:100%;margin-top:12px" data-act="buymanual" data-id="${p.id}">Registrar compra a mano</button></div>`}
    </div>

    <button class="btn" style="width:100%;color:var(--danger);display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;padding:14px" data-act="delplant" data-id="${p.id}">${ic("trash","s")} Eliminar planta</button>
    <div style="height:40px"></div>
  </div>`;
}

function specRow(l,v){ return `<div class="specrow"><b>${l}</b><span style="color:${v?"var(--ink)":"var(--faint)"}">${v?esc(v):"—"}</span></div>`; }
function field(label,fk,val,ph,ta,id){ const attr=`data-focus="${fk}" data-inp="${fk}" ${id?`data-id="${id}"`:""}`;
  return `<label class="f"><span>${label}</span>${ta?`<textarea class="inp" rows="3" ${attr} placeholder="${ph}">${esc(val)}</textarea>`:`<input class="inp" ${attr} value="${esc(val)}" placeholder="${ph}">`}</label>`; }
function stepper(fk,v,id){ return `<span class="stepper"><button data-act="step" data-fk="${fk}" data-id="${id}" data-d="-1">–</button><span class="val">${qtyfmt(v)}</span><button data-act="step" data-fk="${fk}" data-id="${id}" data-d="1">+</button></span>`; }
function moneyIn(fk,v,id){ return `<span class="moneyin"><span>$</span><input inputmode="decimal" data-focus="${fk}" data-inp="${fk}" data-id="${id}" value="${esc(v)}" placeholder="0"></span>`; }
function zonePicker(val){ const custom=val&&!ZONES.includes(val);
  return `<div class="chips">${ZONES.map(z=>`<button class="chip ${val===z?"on":""}" data-act="zone" data-z="${esc(z)}">${esc(z)}</button>`).join("")}</div>
    <input class="inp" style="margin-top:8px" data-focus="zone-custom" data-inp="zone-custom" value="${custom?esc(val):""}" placeholder="Otra zona…">`; }

function propRow(p,pr,bp){ const isBest=Number(pr.price)===bp, isFinal=p.finalProposalId===pr.id;
  return `<div class="prop ${isFinal?"final":""}">
    <div class="rowtop"><div style="min-width:0">
      <div style="display:flex;align-items:center;gap:6px"><span style="color:var(--sub)">${ic("store","xs")}</span><b style="font-size:14px">${esc(pr.supplier||"Local sin nombre")}</b>${isBest?`<span class="tag">${ic("award","xs")} mejor</span>`:""}</div>
      ${pr.location?`<div style="font-size:12px;color:var(--faint);margin-top:2px">${esc(pr.location)}</div>`:""}
      ${pr.notes?`<div style="font-size:12px;color:var(--sub);margin-top:4px">${esc(pr.notes)}</div>`:""}
    </div><div style="text-align:right"><div class="pr">${money(pr.price)}</div>${Number(p.target)?`<div style="margin-top:2px">${tgtDelta(pr.price,p.target)}</div>`:""}${pr.qtyAvailable?`<div style="font-size:12px;color:var(--faint)">${esc(pr.qtyAvailable)} disp.</div>`:""}</div></div>
    <div class="rowbtns"><button class="btn ${isFinal?"primary":""}" style="flex:1;${isFinal?"":"border:1px solid var(--forest);color:var(--forest)"}" data-act="choose" data-id="${p.id}" data-pid="${pr.id}">${ic("check","xs")} ${isFinal?"Elegida":"Elegir"}</button>
      <button class="btn ghost" style="color:var(--danger)" data-act="delprop" data-id="${p.id}" data-pid="${pr.id}">${ic("trash","xs")}</button></div></div>`; }

function propForm(id){ const d=S.propDraft||{};
  return `<div class="prop" style="border-color:var(--forest)">
    ${field("Local / proveedor","prop-supplier",d.supplier||"","Ej. Talibán")}
    <div class="space"></div>${field("Ubicación / pasillo","prop-location",d.location||"","Ej. entrada, fondo izq.")}
    <div class="space"></div><div style="display:flex;gap:8px">
      <label class="f" style="flex:1"><span>Precio unitario</span><div style="margin-top:4px">${moneyIn("prop-price",d.price||"","")}</div></label>
      <label class="f" style="flex:1"><span>Disponibles</span><input class="inp" inputmode="numeric" data-focus="prop-qty" data-inp="prop-qty" value="${esc(d.qtyAvailable||"")}" placeholder="—"></label>
    </div>
    <div class="space"></div>${field("Notas","prop-notes",d.notes||"","Regateo, calidad, cepellón…")}
    <div class="rowbtns"><button class="btn primary" style="flex:1" ${(!d.price)?"disabled":""} data-act="saveprop" data-id="${id}">Guardar propuesta</button>
      <button class="btn ghost" data-act="canprop">Cancelar</button></div></div>`; }

function modalAdd(){ const d=S.addDraft||{}; const custom=d.zone&&!ZONES.includes(d.zone);
  return `<div class="overlay" data-act="closeadd-bg"><div class="sheet">
    <div class="sh"><h1 style="font-size:20px">Nueva planta</h1><button data-act="closeadd">${ic("x")}</button></div>
    ${field("Nombre común","add-name",d.name||"","Ej. Agapando")}
    <div class="space"></div>${field("Nombre científico (opcional)","add-sci",d.scientific||"","Ej. Agapanthus africanus")}
    <div class="space"></div><div style="display:flex;gap:8px;align-items:flex-end">
      <div><span style="font-size:12px;color:var(--sub)">Cantidad</span><div style="margin-top:4px">${stepper("addqty",d.qtyNeeded||1,"__add")}</div></div>
      <label class="f" style="flex:1"><span>Unidad</span><input class="inp" data-focus="add-unit" data-inp="add-unit" value="${esc(d.unit||"piezas")}"></label>
    </div>
    <div class="space"></div><span style="font-size:12px;color:var(--sub)">Categoría</span>
    <div class="chips" style="margin-top:6px">${CATS.map(c=>`<button class="chip ${(d.category||"Plantas")===c?"on":""}" data-act="addcat" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="space"></div><span style="font-size:12px;color:var(--sub)">Zona de la casa</span>
    <div class="chips" style="margin-top:6px">${ZONES.map(z=>`<button class="chip ${d.zone===z?"on":""}" data-act="addzone" data-z="${esc(z)}">${esc(z)}</button>`).join("")}</div>
    <input class="inp" style="margin-top:8px" data-focus="add-zone-custom" data-inp="add-zone-custom" value="${custom?esc(d.zone):""}" placeholder="Otra zona…">
    <div class="space"></div>${field("Notas","add-notes",d.notes||"","Requisitos, estado deseado…",true)}
    <div class="space"></div><label class="f"><span>Precio objetivo / presupuesto (opcional)</span><div class="moneyin" style="margin-top:4px"><span>$</span><input inputmode="decimal" data-focus="add-target" data-inp="add-target" value="${esc(d.target||"")}" placeholder="0"></div></label>
    <button class="btn primary" style="width:100%;margin-top:16px;padding:14px" ${(!d.name||!d.name.trim())?"disabled":""} data-act="saveadd">Agregar a la lista</button>
  </div></div>`; }

/* ---------------- image compression ---------------- */
function compress(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=e=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height,m=900;
    if(w>h&&w>m){h=Math.round(h*m/w);w=m;} else if(h>m){w=Math.round(w*m/h);h=m;}
    const c=document.createElement("canvas"); c.width=w;c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
    res(c.toDataURL("image/jpeg",0.6)); }; img.onerror=rej; img.src=e.target.result; };
  r.onerror=rej; r.readAsDataURL(file); }); }

/* ---------------- supplier quote PDF (via print) ---------------- */
function buildPdf(){
  const list = S.plants.filter(p=>p.status!=="bought" && (S.cat==="all" || (p.category||"Plantas")===S.cat)).slice()
    .sort((a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"}));
  if(!list.length){ alert("No hay productos pendientes para cotizar en este filtro."); return; }
  const titulo = S.cat==="all" ? "Solicitud de cotización — Productos" : "Solicitud de cotización — "+S.cat;
  const rows = list.map((p,i)=>{
    const specs=[p.specs.size,p.specs.container,p.specs.notes].filter(Boolean).join(" · ");
    return `<tr><td>${i+1}</td>
      <td><b>${esc(p.name)}</b>${p.scientific?`<br><i style="color:#666">${esc(p.scientific)}</i>`:""}${p.zone?`<br><span style="color:#888;font-size:11px">${esc(p.zone)}</span>`:""}</td>
      <td style="text-align:center;white-space:nowrap">${qtyfmt(p.qtyNeeded)} ${esc(uom(p.qtyNeeded,p.unit))}</td>
      <td>${esc(specs)||"—"}</td>
      <td class="fill"></td><td class="fill"></td></tr>`;
  }).join("");
  const totalItems=list.reduce((s,p)=>s+(Number(p.qtyNeeded)||0),0);
  const fecha=new Date().toLocaleDateString("es-MX",{year:"numeric",month:"long",day:"numeric"});
  document.getElementById("printsheet").innerHTML=`<div class="psheet">
    <h1>${esc(titulo)}</h1>
    <div class="pmeta">Casa Jacarandas · ${fecha}</div>
    <table class="pline"><tr><td>Proveedor: ______________________________</td><td style="text-align:right">Contacto/Tel.: __________________</td></tr></table>
    <p class="pnote">Favor de cotizar el <b>precio unitario</b> de cada producto según las especificaciones indicadas.</p>
    <table class="ptable"><thead><tr><th>#</th><th>Producto</th><th>Cant.</th><th>Especificaciones</th><th>Precio unit.</th><th>Importe</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <p class="pnote">Notas / vigencia de la cotización: ____________________________________________________________</p>
  </div>`;
  setTimeout(()=>window.print(),50);
}


function backup(){ const blob=new Blob([JSON.stringify(S.plants,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="cuemanco-respaldo-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); }
function restore(file){ const r=new FileReader();
  r.onload=async()=>{ try{ const data=JSON.parse(r.result);
    if(!Array.isArray(data)) throw 0;
    if(confirm("Restaurar reemplazará tu lista actual con la del respaldo. ¿Continuar?")){ S.plants=data; await persist(); }
  }catch(e){ alert("No pude leer ese archivo de respaldo."); } };
  r.readAsText(file); }

/* ---------------- events ---------------- */
let photoTargetId=null;
document.getElementById("filein").addEventListener("change",async e=>{
  const files=[...(e.target.files||[])]; e.target.value=""; if(!files.length||!photoTargetId) return;
  const p=getP(photoTargetId); if(!p) return;
  for(const f of files){ try{ p.photos.push(await compress(f)); }catch(_){} }
  await persist();
});
document.getElementById("restorein").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) restore(f); });

app.addEventListener("input",async e=>{
  const t=e.target, f=t.dataset.inp; if(!f) return; const id=t.dataset.id, v=t.value;
  if(f==="query"){ S.query=v; render(); return; }
  if(f==="zone-custom"){ const p=getP(S.activeId); if(p){ p.zone=v; await save(); } return; }
  if(f.startsWith("spec-")){ S.specsDraft=S.specsDraft||{...getP(S.activeId).specs}; S.specsDraft[f.slice(5)]=v; return; }
  if(f.startsWith("prop-")){ S.propDraft=S.propDraft||{}; const key={ "prop-supplier":"supplier","prop-location":"location","prop-price":"price","prop-qty":"qtyAvailable","prop-notes":"notes"}[f]; S.propDraft[key]=v; if(f==="prop-price"){ const b=app.querySelector('[data-act="saveprop"]'); if(b){ if(v)b.removeAttribute("disabled"); else b.setAttribute("disabled",""); } } return; }
  if(f.startsWith("add-")){ S.addDraft=S.addDraft||{}; const key={"add-name":"name","add-sci":"scientific","add-unit":"unit","add-notes":"notes","add-zone-custom":"zone","add-target":"target"}[f]; S.addDraft[key]=v; if(f==="add-name"){ const b=app.querySelector('[data-act="saveadd"]'); if(b){ if(v.trim())b.removeAttribute("disabled"); else b.setAttribute("disabled",""); } } return; }
  if(f==="target"){ const p=getP(id); if(p){ p.target=v; await save(); render(); } return; }
  if(f==="finalPrice"){ const p=getP(id); if(p){ p.finalPrice=v; await save(); } return; }
  if(f==="finalSupplier"){ const p=getP(id); if(p){ p.finalSupplier=v; await save(); } return; }
});

app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const act=b.dataset.act, id=b.dataset.id;
  const p=id?getP(id):null;
  switch(act){
    case "tab": S.tab=b.dataset.tab; S.view=b.dataset.tab; render(); break;
    case "filter": S.filter=b.dataset.f; render(); break;
    case "catfilter": S.cat=b.dataset.c; render(); break;
    case "setcat": { if(p){ p.category=b.dataset.c; await persist(); } break; }
    case "sort": S.sort = S.sort==="az"?"original":"az"; render(); break;
    case "open": S.returnTo=S.tab; S.activeId=id; S.view="detail"; S.editSpecs=false; S.specsDraft=null; S.addProp=false; S.propDraft=null; render(); break;
    case "opengroup": S.groupKey=b.dataset.key; S.view="group"; render(); break;
    case "backgroup": S.view="list"; S.groupKey=null; render(); break;
    case "openin": S.returnTo="group"; S.activeId=id; S.view="detail"; S.editSpecs=false; S.specsDraft=null; S.addProp=false; S.propDraft=null; render(); break;
    case "addlike": { const ms=S.plants.filter(p=>p.name.trim().toLowerCase()===S.groupKey); const f=ms[0]||{}; S.showAdd=true; S.addDraft={name:f.name||"",scientific:f.scientific||"",unit:f.unit||"pieza",qtyNeeded:1,zone:"",category:f.category||"Plantas"}; render(); break; }
    case "back": S.view=S.returnTo; S.activeId=null; render(); break;
    case "hidegot": S.hideGot=!S.hideGot; render(); break;
    case "quick": { const q=getP(id); if(q){ if(q.status==="bought"){ q.status=q.proposals.length?"comparing":"pending"; q.finalProposalId=null;q.finalSupplier="";q.finalPrice="";q.finalQty=""; } else { const bpr=bestProp(q); q.status="bought"; q.finalProposalId=bpr?bpr.id:null; q.finalSupplier=bpr?bpr.supplier:""; q.finalPrice=bpr?bpr.price:""; q.finalQty=q.qtyNeeded; } await persist(); } break; }
    case "step": { const d=+b.dataset.d, fk=b.dataset.fk; if(id==="__add"){ S.addDraft=S.addDraft||{}; S.addDraft.qtyNeeded=Math.max(0,(Number(S.addDraft.qtyNeeded)||1)+d); render(); } else { const q=getP(id); if(q){ q[fk]=Math.max(0,(Number(q[fk])||0)+d); await persist(); } } break; }
    case "zone": { if(p){ p.zone=b.dataset.z; await persist(); } break; }
    case "editspecs": S.editSpecs=true; S.specsDraft={...p.specs}; render(); break;
    case "canspecs": S.editSpecs=false; S.specsDraft=null; render(); break;
    case "savespecs": if(p){ p.specs={...(S.specsDraft||p.specs)}; S.editSpecs=false; S.specsDraft=null; await persist(); } break;
    case "addphoto": photoTargetId=id; document.getElementById("filein").click(); break;
    case "delphoto": { const q=getP(id); if(q){ q.photos.splice(+b.dataset.i,1); await persist(); } break; }
    case "addprop": S.addProp=true; S.propDraft={}; render(); break;
    case "canprop": S.addProp=false; S.propDraft=null; render(); break;
    case "saveprop": { const d=S.propDraft||{}; if(p && d.price){ p.proposals.push({id:uid(),supplier:d.supplier||"",location:d.location||"",price:d.price,qtyAvailable:d.qtyAvailable||"",notes:d.notes||""}); if(p.status==="pending")p.status="comparing"; S.addProp=false; S.propDraft=null; await persist(); } break; }
    case "delprop": { if(p){ const pid=b.dataset.pid; p.proposals=p.proposals.filter(x=>x.id!==pid); if(p.finalProposalId===pid)p.finalProposalId=null; await persist(); } break; }
    case "choose": { if(p){ const pr=p.proposals.find(x=>x.id===b.dataset.pid); if(pr){ p.status="bought"; p.finalProposalId=pr.id; p.finalSupplier=pr.supplier; p.finalPrice=pr.price; p.finalQty=p.finalQty||p.qtyNeeded; await persist(); } } break; }
    case "clearfinal": { if(p){ p.status=p.proposals.length?"comparing":"pending"; p.finalProposalId=null;p.finalSupplier="";p.finalPrice="";p.finalQty=""; await persist(); } break; }
    case "buymanual": { if(p){ p.status="bought"; p.finalQty=p.qtyNeeded; await persist(); } break; }
    case "delplant": if(p && confirm('¿Eliminar "'+p.name+'"?')){ S.plants=S.plants.filter(x=>x.id!==id); S.view=S.returnTo; S.activeId=null; await persist(); } break;
    case "add": S.showAdd=true; S.addDraft={qtyNeeded:1,unit:"pieza",category:(S.cat!=="all"?S.cat:"Plantas")}; render(); break;
    case "closeadd-bg": if(e.target===b){ S.showAdd=false; S.addDraft=null; render(); } break;
    case "closeadd": S.showAdd=false; S.addDraft=null; render(); break;
    case "addcat": S.addDraft=S.addDraft||{}; S.addDraft.category=b.dataset.c; render(); break;
    case "addzone": S.addDraft=S.addDraft||{}; S.addDraft.zone=b.dataset.z; render(); break;
    case "saveadd": { const d=S.addDraft||{}; if(d.name&&d.name.trim()){ S.plants.push(mk({id:uid(),name:d.name.trim(),scientific:d.scientific||"",qtyNeeded:Number(d.qtyNeeded)||1,unit:d.unit||"pieza",zone:d.zone||"",category:d.category||"Plantas",target:d.target||"",specs:{size:"",container:"",notes:d.notes||""}})); S.showAdd=false; S.addDraft=null; await persist(); } break; }
    case "backup": backup(); break;
    case "restore": document.getElementById("restorein").click(); break;
    case "pdf": buildPdf(); break;
  }
});

init();
</script>
</body>
</html>
